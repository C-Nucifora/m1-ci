# pre-commit hooks for M1 projects — the local half of m1-ci.
#
# Add to your project's .pre-commit-config.yaml, pinning the SAME m1-ci tag your
# CI workflow uses so local and CI run an identical, frozen toolchain:
#
#   repos:
#     - repo: https://github.com/C-Nucifora/m1-ci
#       rev: vX.Y.Z  # the same m1-ci tag as your workflow's `uses: …check.yml@vX.Y.Z`
#       hooks:
#         - id: m1-fmt
#         - id: m1-lint
#         - id: m1-typecheck
#         - id: m1-project-validate
#         - id: m1-can-export-check
#
# Each hook downloads (once, cached) the pinned tool binary named in tools.env —
# the same version CI installs — so there is nothing to install by hand.
- id: m1-fmt
  name: m1-fmt (format check)
  description: Check MoTeC M1 script formatting (m1-fmt --check).
  entry: hooks/m1-fmt
  language: script
  files: \.m1scr$
- id: m1-lint
  name: m1-lint
  description: Lint MoTeC M1 scripts (m1-lint).
  entry: hooks/m1-lint
  language: script
  files: \.m1scr$
- id: m1-typecheck
  name: m1-typecheck
  description: Type-check MoTeC M1 scripts (m1-typecheck).
  entry: hooks/m1-typecheck
  language: script
  files: \.m1scr$
- id: m1-project-validate
  name: m1-project validate
  description: Validate MoTeC M1 Project.m1prj structure (m1-project validate).
  entry: hooks/m1-project-validate
  language: script
  files: (^|/)Project\.m1prj$
- id: m1-can-export-check
  name: m1-can export --check
  description: Check the committed Vector .dbc exports are in sync with their .m1dbc sources (m1-can export --check).
  entry: hooks/m1-can-export-check
  language: script
  files: (\.(m1dbc|dbc)$|(^|/)m1-tools\.toml$)
  # The config is a trigger because changing [dbc] can repoint an export without
  # touching either database file.
  # m1-can takes NO filename arguments: the run is whole-config, driven by the
  # [dbc] section of the m1-tools.toml found by walking up from the working
  # directory. `files` only decides WHETHER the hook runs on this commit; the
  # names must not be appended to the command line (the binary would reject
  # them as a bad invocation, exit 2).
  pass_filenames: false
- id: m1-can-overlap-check
  name: m1-can inspect (CAN id clashes)
  description: Fail when two CAN messages share an identifier on the same bus (m1-can inspect).
  entry: hooks/m1-can-overlap-check
  language: script
  # Ids come from the .m1dbc; the bus binding comes from the DBC.<Name>.Init
  # call in a script; a bus named by a parameter is resolved from the .m1cfg;
  # and the project ties them together. Any of them can turn a safe reuse into
  # a clash, so all four are triggers.
  files: (\.(m1dbc|m1scr|m1cfg)$|(^|/)Project\.m1prj$)
  # inspect needs --project, which cannot be inferred from the staged names, so
  # the consumer supplies it: args: [--project, <path>/Project.m1prj]
  pass_filenames: false

